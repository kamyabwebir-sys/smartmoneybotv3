name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint tracked Python sources
        shell: pwsh
        run: |
          $files = git ls-files "*.py"
          python -m ruff check $files

      - name: Run test suite
        run: python -m pytest

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          $files = git ls-files "*.ps1"
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              $errors += "$file`:$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | Write-Error
            exit 1
          }
