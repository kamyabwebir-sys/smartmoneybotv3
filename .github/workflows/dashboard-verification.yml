name: Dashboard R8 Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and pytest
        run: python -m pip install -e . pytest

      - name: R8.7 verification
        run: python scripts/dashboard_release_gate.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dashboard/evidence/
          if-no-files-found: warn
          retention-days: 30

  dashboard-production-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: dashboard-verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dashboard-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and pytest
        run: python -m pip install -e . pytest

      # Re-run on the signing runner rather than trusting downloaded evidence.
      - name: Verify exact signing revision
        run: python scripts/dashboard_release_gate.py --require-signature

      - name: Issue and verify signed R8.8 receipt
        env:
          R8_RELEASE_REF: ${{ vars.R8_RELEASE_REF }}
          R8_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.R8_SIGNING_PRIVATE_KEY_PEM }}
          R8_SIGNING_PUBLIC_KEY_PEM: ${{ vars.R8_SIGNING_PUBLIC_KEY_PEM }}
        run: python scripts/dashboard_release_gate.py --require-signature --require-clean-worktree

      - name: Upload production gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-production-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dashboard/evidence/
          if-no-files-found: warn
          retention-days: 90
