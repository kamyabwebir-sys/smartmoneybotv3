[pytest]
minversion = 8.0
testpaths =
    tests
    test_integration.py
    test_ledger_integration.py
    test_ledger_persistence.py
    test_population.py
    test_replay_engine.py
    test_scoring.py
pythonpath = src
addopts = -ra --strict-markers --strict-config --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: run the test with an asyncio event loop
