<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Money Live</title>
<style>body{font-family:Tahoma,sans-serif;background:#07111f;color:#dbeafe;margin:0}main{max-width:1200px;margin:auto;padding:24px}.bar,.card{background:#101d31;border:1px solid #263b59;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:2rem;color:#67e8f9}button,input,select{padding:9px;border-radius:8px;border:1px solid #39506f;background:#0b1728;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #263b59;text-align:right}.bad{color:#fca5a5}.good{color:#86efac}pre{white-space:pre-wrap;direction:ltr;text-align:left}</style></head>
<body><main><h1>داشبورد زندهٔ شواهد</h1><div class="bar"><input id="token" type="password" placeholder="Bearer token"><input id="reviewer" placeholder="نام بررسی‌کننده"><button onclick="load()">تازه‌سازی</button><span id="fresh"></span></div><div id="metrics" class="grid"></div><div class="card"><h2>کیفیت روی دادهٔ مستقل</h2><div id="quality">پس از احراز هویت بارگیری می‌شود.</div></div><div class="card"><h2>کاندیدها</h2><table><thead><tr><th>شناسه</th><th>توکن</th><th>امتیاز</th><th>Safety</th><th>Funding</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><h2>جزئیات شواهد</h2><pre id="detail">یک کاندید را انتخاب کنید.</pre></div></main>
<script>const hdr=()=>({Authorization:'Bearer '+document.getElementById('token').value});async function req(path,opt={}){const r=await fetch(path,{...opt,headers:{...hdr(),'Content-Type':'application/json'},cache:'no-store'});if(!r.ok)throw Error((await r.json()).detail||r.status);return r.json()}async function load(){try{const [d,q]=await Promise.all([req('/api/v1/live/overview'),req('/api/v1/live/quality')]);fresh.textContent=`سن داده: ${d.freshness.age_seconds}s ${d.freshness.stale?'(قدیمی)':'(تازه)'}`;fresh.className=d.freshness.stale?'bad':'good';metrics.innerHTML=Object.entries(d.counts).map(([k,v])=>`<div class=card><div>${k}</div><div class=metric>${v}</div></div>`).join('');quality.textContent=`نمونه: ${q.sample_count} | precision: ${(q.precision_bps/100).toFixed(2)}% | recall: ${(q.recall_bps/100).toFixed(2)}% | حذف Safety/Funding: ${q.excluded_by_safety}/${q.excluded_by_funding}`;rows.innerHTML=d.candidates.map(c=>`<tr><td>${c.candidate_id||'-'}</td><td>${c.mint||'-'}</td><td>${c.score_bps??c.score??'-'}</td><td>${c.safety_status}</td><td>${c.funding_status}</td><td><button onclick="detail('${c.candidate_id}')">شواهد</button> <button onclick="review('${c.candidate_id}','ACCEPTED')">تأیید</button> <button onclick="review('${c.candidate_id}','REJECTED')">رد</button></td></tr>`).join('')}catch(e){fresh.textContent=e.message;fresh.className='bad'}}async function detail(id){try{document.getElementById('detail').textContent=JSON.stringify(await req('/api/v1/live/candidates/'+encodeURIComponent(id)),null,2)}catch(e){document.getElementById('detail').textContent=e.message}}async function review(id,status){const reviewer=document.getElementById('reviewer').value;if(!reviewer){alert('نام بررسی‌کننده لازم است');return}try{const d=await req('/api/v1/live/reviews',{method:'POST',body:JSON.stringify({candidate_id:id,status,reviewer})});alert('ثبت شد: '+d.review_id)}catch(e){alert(e.message)}}setInterval(()=>{if(document.getElementById('token').value)load()},15000)</script></body></html>
