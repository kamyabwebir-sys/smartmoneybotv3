[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmoneybotv3"
version = "0.1.0"
description = "Deterministic, explainable, replayable market-structure and discovery platform with Persian-first reporting."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "smartmoneybotv3" }
]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "test_integration.py",
  "test_ledger_integration.py",
  "test_ledger_persistence.py",
  "test_scoring.py",
]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib"
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "asyncio: run the test with an asyncio event loop",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
